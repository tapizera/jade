<!doctype html>
<html lang="pt-BR" data-theme="jade">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jade</title>
<meta name="theme-color" content="#0e1b15">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1b15;--bg2:#16301f;--panel:#142a1f;--line:#2f503c;--ink:#e8f0da;--mute:#9db89f;--acc:#7fd6a0;--acc2:#d9b45a;--warm:#e8b04a;--ok:#9be3a6;--track:#21402f;--r:18px;--sh:0 6px 18px rgba(0,0,0,.28);--gl:3px;--rain:.5;--grid:transparent;--font:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;--fs:17px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="neon"]{--bg:#080618;--bg2:#190b3a;--panel:#100a2c;--line:#3d2a96;--ink:#ece8ff;--mute:#a89fd8;--acc:#37f2ff;--acc2:#b36bff;--warm:#ff58d6;--ok:#52ffc4;--track:#241a5c;--r:12px;--sh:0 0 18px rgba(179,107,255,.22);--gl:9px;--rain:0;--grid:rgba(55,242,255,.07);--font:"Rajdhani",system-ui,-apple-system,"Segoe UI",sans-serif;--fs:18px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.35;background-color:var(--bg);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(ellipse at 50% 0,var(--bg2),transparent 70%);
background-size:30px 30px,30px 30px,100% 100%;background-attachment:fixed}
.rain{position:fixed;inset:0;pointer-events:none;opacity:var(--rain);z-index:0;
background-image:linear-gradient(104deg,transparent 0 47%,rgba(190,225,205,.55) 48% 50%,transparent 51%),linear-gradient(104deg,transparent 0 48%,rgba(190,225,205,.35) 49% 50%,transparent 51%);
background-size:26px 110px,41px 170px;animation:rain 1s linear infinite}
@keyframes rain{to{background-position:-18px 110px,-28px 170px}}
@media (prefers-reduced-motion:reduce){.rain,.spin,.quote p{animation:none!important}}
main{position:relative;z-index:1;max-width:1380px;margin:0 auto;padding:18px 16px 44px;display:grid;gap:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:42px;height:42px;filter:drop-shadow(0 0 var(--gl) var(--acc))}
h1{margin:0;font-size:32px;font-weight:800;line-height:1}
.sub{margin:3px 0 0;color:var(--mute);font-size:15px}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock{text-align:right;font-size:30px;font-weight:700;color:var(--acc);line-height:1}
.clock small{display:block;font-size:14px;font-weight:600;color:var(--mute);margin-top:4px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:var(--sh)}
.tabs{display:flex;gap:8px}
.tab[aria-selected="true"]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.cols{display:grid;gap:16px;align-items:start;grid-template-columns:1fr}
@media (min-width:700px){.cols{grid-template-columns:1fr 1fr}}
@media (min-width:1050px){.cols{grid-template-columns:.85fr 1.4fr .9fr}}
.col{display:grid;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--sh)}
h2{margin:0 0 10px;font-size:19px;font-weight:800;color:var(--acc)}
.quote{text-align:center;padding:18px 22px;overflow:hidden}
.quote p{margin:0;font-size:clamp(18px,2.2vw,27px);font-weight:700;cursor:pointer}
.quote small{display:block;margin-top:6px;color:var(--mute);font-size:15px}
.quote.gl p{animation:gl .6s steps(2,end)}
@keyframes gl{0%{transform:none;text-shadow:none;clip-path:inset(0)}15%{transform:translate(-4px,1px);text-shadow:3px 0 var(--acc2),-3px 0 var(--acc);clip-path:inset(10% 0 55% 0)}30%{transform:translate(5px,-1px);text-shadow:-4px 0 var(--warm),4px 0 var(--acc);clip-path:inset(55% 0 5% 0)}45%{transform:translate(-2px,0);text-shadow:2px 0 var(--acc2),-2px 0 var(--acc);clip-path:inset(0)}60%{opacity:.4;transform:translate(3px,1px)}80%{opacity:1;transform:translate(-1px,0);text-shadow:1px 0 var(--acc)}100%{transform:none;text-shadow:none;clip-path:inset(0)}}
.core{display:grid;justify-items:center;padding:16px 12px 14px;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 64%),var(--panel)}
.reactor{width:min(220px,64vw);aspect-ratio:1}
.reactor svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 var(--gl) var(--acc))}
.spin{transform-origin:100px 100px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{transition:stroke-dashoffset .6s ease,stroke .3s}
.big{font:800 56px var(--font);fill:var(--ink)}
.lbl{font:600 13px var(--font);fill:var(--mute)}
.status{margin:6px 0 0;text-align:center;font-size:17px;font-weight:700}
.status.warn{color:var(--warm)}.status.good{color:var(--ok)}
form.cap{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],select{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
input[type=text]{flex:1;min-width:140px}
input[type=text]::placeholder{color:var(--mute)}
select{max-width:100%}
.btn{display:inline-block;text-decoration:none;background:var(--acc);color:var(--bg);border:0;border-radius:12px;padding:10px 18px;font-weight:800}
details.lst{border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-top:10px}
details.lst summary{cursor:pointer;font-weight:800;padding:8px 0;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.lst summary::-webkit-details-marker{display:none}
.cnt{color:var(--mute);font-weight:700}
ul{list-style:none;margin:0 0 6px;padding:0}
li.it{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
li.it input{margin-top:5px;width:18px;height:18px;accent-color:var(--acc);flex:none}
li.it span{flex:1;min-width:0;overflow-wrap:anywhere}
li.it.done span{text-decoration:line-through;color:var(--mute)}
.x{background:none;border:0;color:var(--mute);padding:0 4px}
.note{color:var(--mute);font-size:14px;margin:10px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dr{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:84px;transition:border-color .2s,transform .2s}
.dr:hover{border-color:var(--acc);transform:translateY(-2px)}
.dr b{display:block;font-size:19px}
.dr span{color:var(--mute);font-size:15px}
table{width:100%;border-collapse:collapse}
td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
td:first-child{color:var(--mute);width:46%;padding-right:8px}
.out{margin:10px 0 0;color:var(--warm);font-size:15px}
.timer{display:grid;justify-items:center;gap:10px;text-align:center}
.graph{display:grid;justify-items:center;gap:14px;text-align:center;padding:40px 20px}
.graph p{margin:0;max-width:520px;color:var(--mute)}
[hidden]{display:none!important}
.dr{cursor:pointer;position:relative}.ed{position:absolute;top:6px;right:6px}
.io{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#bgimg{position:fixed;inset:0;z-index:0;pointer-events:none;display:none;background-image:linear-gradient(rgba(6,18,12,.55),rgba(6,18,12,.74)),url("fundo.gif");background-size:cover;background-position:center;image-rendering:pixelated}
:root[data-theme="jade"] #bgimg{display:block}
:root[data-theme="jade"] .panel{background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sec{margin-bottom:24px}.rw{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.rw input[type=text]{flex:1;min-width:110px}.rw input.sm{flex:0 0 64px;min-width:64px;text-align:center}
.foco{display:grid;justify-items:center;gap:16px;padding:4px 0 24px}
.foco .back{justify-self:start}
.tm{position:relative;width:min(74vmin,520px);aspect-ratio:1}
.tm svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 var(--gl) var(--acc))}
#tt{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(56px,16vmin,150px);font-weight:800;text-shadow:0 2px 18px rgba(0,0,0,.65)}
.ctr{justify-content:center}.pre{min-width:52px}
.foco .mode{text-shadow:0 1px 8px rgba(0,0,0,.6)}
.v-foco header{display:none}
.v-relaxar .tabs,.v-relaxar #theme,.v-relaxar #graphbtn{display:none}
a.pill{text-decoration:none;color:inherit}
input[type=number]{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 10px;width:84px;text-align:center}
</style>
</head>
<body>
<div id="bgimg" aria-hidden="true"></div>
<main>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="16" rx="10.5" ry="13.8" fill="var(--acc)" fill-opacity=".22" stroke="var(--acc)" stroke-width="1.8"/></svg>
    <div><h1>Jade</h1><p class="sub" id="greet">Olá</p></div>
  </div>
  <div class="right">
    <div class="tabs" role="tablist">
      <button class="pill tab" id="t-painel" role="tab" type="button" aria-selected="true">💎 Painel</button>
      <button class="pill tab" id="t-relaxar" role="tab" type="button" aria-selected="false">🌿 Relaxar</button>
      <button class="pill tab" id="t-ajustes" role="tab" type="button" aria-selected="false">⚙️ Ajustes</button>
    </div>
    <a class="pill" id="graphbtn" href="https://ivgraph.com/app/" target="_blank" rel="noopener">🕸️ Grafo</a>
    <button class="pill" id="exit" type="button" hidden>🌿 Sair do relaxar</button>
    <button class="pill" id="theme" type="button">🌌 Neon</button>
    <div class="clock"><span id="clk">--:--</span><small id="dt"></small></div>
  </div>
</header>

<div id="v-painel">
 <section class="panel quote" aria-live="polite"><p id="qt">…</p><small id="qa"></small></section>
 <div class="cols" style="margin-top:16px">
  <div class="col">
   <section class="panel core" aria-label="Pendentes">
     <div class="reactor">
       <svg viewBox="0 0 200 200" role="img" aria-label="Progresso das listas">
         <g class="spin"><circle cx="100" cy="100" r="94" fill="none" stroke="var(--acc)" stroke-width="1.5" stroke-dasharray="3 9" opacity=".6"/></g>
         <circle cx="100" cy="100" r="78" fill="none" stroke="var(--track)" stroke-width="12"/>
         <circle id="bar" class="bar" cx="100" cy="100" r="78" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="490.1" stroke-dashoffset="490.1" transform="rotate(-90 100 100)"/>
         <circle cx="100" cy="100" r="58" fill="none" stroke="var(--line)" stroke-width="1"/>
         <text id="num" class="big" x="100" y="112" text-anchor="middle">0</text>
         <text class="lbl" x="100" y="134" text-anchor="middle">pendentes</text>
       </svg>
     </div>
     <p class="status" id="status"></p>
   </section>
   <section class="panel timer">
     <h2 style="margin:0">Foco e pausa</h2>
     <a class="btn" href="#foco">Abrir timer</a>
     <p class="note" id="mini" style="margin:0">Pronto para começar</p>
   </section>
  </div>

  <div class="col">
   <section class="panel">
     <h2>Minhas listas</h2>
     <form class="cap" id="form">
       <select id="sel" aria-label="Lista de destino"></select>
       <input type="text" id="in" placeholder="Capturar agora" autocomplete="off" aria-label="Capturar agora">
       <button class="btn" type="submit">Adicionar</button>
     </form>
     <div id="lists"></div>
     <p class="note">As listas ficam salvas só neste aparelho. Backup e personalização em ⚙️ Ajustes.</p>
   </section>
  </div>

  <div class="col">
   <section class="panel">
     <h2>Gavetas</h2>
     <div class="grid" id="drawers"></div>
     <p class="note">Toque para abrir. Nomes, ícones e links em ⚙️ Ajustes.</p>
   </section>
   <section class="panel">
     <h2>Qual app para quê</h2>
     <table id="apps"></table>
     <p class="out" id="out"></p>
   </section>
  </div>
 </div>
</div>

<section class="panel" id="v-ajustes" hidden>
  <h2 style="font-size:26px;margin:0 0 14px">⚙️ Ajustes</h2>
  <div id="set"></div>
</section>
<section class="foco" id="v-foco" hidden>
  <button class="pill back" id="fback" type="button">← Painel</button>
  <div class="tm">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="88" fill="none" stroke="var(--track)" stroke-opacity=".8" stroke-width="9"/>
      <circle id="tbar" cx="100" cy="100" r="88" fill="none" stroke="var(--acc)" stroke-width="9" stroke-linecap="round" stroke-dasharray="552.92" stroke-dashoffset="0" transform="rotate(-90 100 100)" style="transition:stroke-dashoffset .4s linear"/>
    </svg>
    <div id="tt" aria-live="off">25:00</div>
  </div>
  <div class="mode" id="tlabel">Foco de 25 min</div>
  <div class="rw ctr">
    <button class="pill pre" type="button" data-m="5">5</button><button class="pill pre" type="button" data-m="15">15</button><button class="pill pre" type="button" data-m="25">25</button><button class="pill pre" type="button" data-m="50">50</button>
    <input type="number" id="tmin" min="1" max="180" aria-label="Minutos"><span class="mode">min</span>
  </div>
  <div class="rw ctr"><button class="btn" id="tgo" type="button">Iniciar</button><button class="pill" id="trs" type="button">Resetar</button></div>
</section>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* configuração pessoal (fica só no navegador) */
function sx(x,m){return typeof x==="string"?x.slice(0,m):""}
function ux(x){x=sx(x,500);return /^https:\/\//i.test(x)?x:""}
function clean(c){c=c||{};return{name:sx(c.name,40),
  drawers:(Array.isArray(c.drawers)?c.drawers:[]).slice(0,12).map(function(d){d=d||{};return{e:sx(d.e,8),n:sx(d.n,40),d:sx(d.d,60),u:ux(d.u)}}),
  apps:(Array.isArray(c.apps)?c.apps:[]).slice(0,20).map(function(a){a=a||{};return{f:sx(a.f,50),a:sx(a.a,50)}}),
  out:sx(c.out,300)}}
var DEF={name:"",drawers:[{e:"📥",n:"Entrada",d:"Captura rápida",u:""},{e:"📚",n:"Estudos",d:"Cursos e anotações",u:""},{e:"🧠",n:"Ideias",d:"Princípios e reflexões",u:""},{e:"⚙️",n:"Sistema",d:"Regras e apps",u:""}],
  apps:[{f:"📅 Prazos",a:"🗓️ Agenda"},{f:"⏰ Hábitos",a:"📱 App de hábitos"},{f:"🛎️ Lembretes",a:"🔔 App de lembretes"},{f:"📝 Notas",a:"📝 App de notas"}],out:""};
var CFG=clean(load("jade.cfg",null)||DEF);
var BG=load("jade.bg","");if(typeof BG!=="string"||BG.indexOf("data:image/")!==0)BG="";
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* tema */
var root=document.documentElement;
function setTheme(t){root.setAttribute("data-theme",t);$("theme").textContent=t==="jade"?"🌌 Neon":"🌲 Jade";save("jv.theme2",t)}
setTheme(load("jv.theme2","jade")==="neon"?"neon":"jade");
$("theme").onclick=function(){setTheme(root.getAttribute("data-theme")==="jade"?"neon":"jade")};

/* abas */
var VIEWS=["painel","ajustes","foco","relaxar"];
function view(){var h=location.hash.slice(1);if(VIEWS.indexOf(h)<0)h="painel";
  VIEWS.forEach(function(v){var s=$("v-"+v);if(s)s.hidden=v!==h;var t=$("t-"+v);if(t)t.setAttribute("aria-selected",String(v===h))});
  document.body.className="v-"+h;$("exit").hidden=h!=="relaxar"}
VIEWS.forEach(function(v){var t=$("t-"+v);if(t)t.onclick=function(){location.hash=v}});
function toPainel(){location.hash="painel"}
$("exit").onclick=toPainel;$("fback").onclick=toPainel;
addEventListener("keydown",function(e){if(e.key==="Escape"&&(location.hash==="#relaxar"||location.hash==="#foco"))toPainel()});
addEventListener("hashchange",view);view();

/* relógio */
function tick(){
  var d=new Date(),h=d.getHours();
  $("clk").textContent=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  $("dt").textContent=d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  $("greet").textContent=(h<5?"Boa madrugada":h<12?"Bom dia":h<18?"Boa tarde":"Boa noite")+(CFG.name?", "+CFG.name:"")}
tick();setInterval(tick,20000);

/* frases com glitch */
var Q=[
["O descanso só é prazeroso quando ele é o resultado do dever cumprido","Matheus Menucci"],
["Disciplina é regra, não sentimento",""],
["Pra quebrar a inércia, aja sem pensar",""],
["Nada começa perfeito, começa rabiscando",""],
["Aceita a bagunça e elimina fazendo!",""],
["Foco = consequência da falta de distrações",""],
["Não fique na ferramenta, foque no objetivo",""],
["Descansar é um pedaço essencial da produtividade",""],
["Analise oq já funcionou e replique",""],
["Tudo oq vc quer está do outro lado do medo",""],
["Não precisa ser perfeito, basta ser feito",""],
["Quer? Só começa",""],
["Foque no agora, aja agora, o momento perfeito… é agora!","Mark Tillbury"],
["Vai passar, tá passando, e já passou",""],
["A vida é simples",""],
["Seja quem você precisava quando era mais jovem",""],
["Você já sobreviveu a dias piores, siga",""],
["Não espere a chuva passar; aprenda a dançar encharcado",""],
["A vida é uma jornada, não uma corrida",""],
["Seus erros são degraus necessários para melhorar",""],
["Posso não ter chegado lá ainda, mas estou mais perto do que estava ontem",""],
["Descartar é mais fácil do que coletar",""],
["Estudar é saber o quanto eu sei sobre algo","LumberGeek"],
["Produza algo para alguém, assim vc se esforça para garantir o conhecimento","Corre de PhD"],
["Todo mundo quer o topo, mas ninguém quer escalar até lá",""],
["Transforme a dificuldade em diversão",""],
["Os programadores de amanhã são os magos do futuro","Gabe Newell"]
];
var qi=-1;
function setQ(i){$("qt").textContent="“"+Q[i][0]+"”";$("qa").textContent=Q[i][1]?"— "+Q[i][1]:""}
function nextQ(){
  var n;do{n=Math.floor(Math.random()*Q.length)}while(n===qi&&Q.length>1);qi=n;
  var box=$("qt").parentNode;
  if(reduce){setQ(n);return}
  box.classList.remove("gl");void box.offsetWidth;box.classList.add("gl");
  setTimeout(function(){setQ(n)},280);
  setTimeout(function(){box.classList.remove("gl")},700)}
nextQ();setInterval(nextQ,18000);$("qt").onclick=nextQ;

/* listas (cópia do Notion, 15/11) */
var SEED=[
{n:"🧠 Decisões e perguntas",i:[]},{n:"📥 Inbox",i:[]},{n:"🔍 Pesquisar",i:[]},{n:"🇯🇵 Assistir",i:[]},{n:"💵 Dinheiro",i:[]},{n:"❔ Curiosidade e outros",i:[]}
];
var lists=load("jv.lists3",null);
if(!lists){lists=SEED.map(function(l){return{n:l.n,i:l.i.map(function(x){return{t:x[0],d:!!x[1]}})}})}
var openIdx=[0];
function commit(){save("jv.lists3",lists);render()}
function render(){
  var sel=$("sel"),cur=sel.value||"0";sel.textContent="";
  lists.forEach(function(l,k){var o=document.createElement("option");o.value=k;o.textContent=l.n;sel.appendChild(o)});
  sel.value=cur<lists.length?cur:"0";
  var box=$("lists");box.textContent="";var total=0,done=0;
  lists.forEach(function(l,k){
    var d=document.createElement("details");d.className="lst";d.open=openIdx.indexOf(k)>-1;
    d.ontoggle=function(){var p=openIdx.indexOf(k);if(d.open&&p<0)openIdx.push(k);if(!d.open&&p>-1)openIdx.splice(p,1)};
    var dn=l.i.filter(function(x){return x.d}).length;total+=l.i.length;done+=dn;
    var s=document.createElement("summary");
    var a=document.createElement("span");a.textContent=l.n;
    var c=document.createElement("span");c.className="cnt";c.textContent=dn+"/"+l.i.length;
    s.appendChild(a);s.appendChild(c);d.appendChild(s);
    var ul=document.createElement("ul");
    l.i.forEach(function(it){
      var li=document.createElement("li");li.className="it"+(it.d?" done":"");
      var cb=document.createElement("input");cb.type="checkbox";cb.checked=it.d;
      cb.onchange=function(){it.d=cb.checked;commit()};
      var t=document.createElement("span");t.textContent=it.t;
      var x=document.createElement("button");x.type="button";x.className="x";x.textContent="✕";x.setAttribute("aria-label","Apagar");
      x.onclick=function(){l.i=l.i.filter(function(y){return y!==it});commit()};
      li.appendChild(cb);li.appendChild(t);li.appendChild(x);ul.appendChild(li)});
    d.appendChild(ul);box.appendChild(d)});
  var open=total-done;
  $("bar").style.strokeDashoffset=490.1*(1-(total?done/total:1));
  $("bar").style.stroke=open?"var(--warm)":"var(--ok)";
  $("num").textContent=open;
  var st=$("status");
  if(!open){st.textContent="Tudo feito";st.className="status good"}
  else{st.textContent=done+" de "+total+" feitos";st.className="status warn"}}
$("form").onsubmit=function(e){
  e.preventDefault();var v=$("in").value.trim();if(!v)return;
  var k=parseInt($("sel").value,10)||0;
  lists[k].i.unshift({t:v,d:false});if(openIdx.indexOf(k)<0)openIdx.push(k);
  $("in").value="";commit()};
/* timer */
var tmin=load("jv.tmin",25);if(typeof tmin!=="number"||tmin<1||tmin>180)tmin=25;
var tTotal=tmin*60,tLeft=tTotal,tEnd=0,tRun=null,tDone=false,CIRC=552.92;
function tfmt(s){var m=Math.floor(s/60),x=s%60;return(m<10?"0":"")+m+":"+(x<10?"0":"")+x}
function tdraw(){
  var part=tLeft<tTotal&&tLeft>0;
  $("tt").textContent=tfmt(tLeft);
  $("tbar").style.strokeDashoffset=CIRC*(1-(tTotal?tLeft/tTotal:0));
  $("tgo").textContent=tRun?"Pausar":(part?"Continuar":"Iniciar");
  $("tlabel").textContent=tDone?"Acabou! 🎉":"Foco de "+tmin+" min";
  $("tmin").value=tmin;
  $("mini").textContent=tRun?"⏱️ "+tfmt(tLeft)+" rodando":(part?"⏸️ "+tfmt(tLeft)+" pausado":(tDone?"Acabou! 🎉":"Pronto: "+tmin+" min"));
  document.title=tRun?tfmt(tLeft)+" · Jade":"Jade"}
function beep(){try{var ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(ac.destination);o.frequency.value=660;g.gain.setValueAtTime(.001,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.3,ac.currentTime+.05);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+1.2);
  o.start();o.stop(ac.currentTime+1.3)}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
function tstop(){clearInterval(tRun);tRun=null}
function tstep(){tLeft=Math.max(0,Math.round((tEnd-Date.now())/1000));if(tLeft<=0){tstop();tDone=true;beep()}tdraw()}
function tstart(){if(tLeft<=0)tLeft=tTotal;tDone=false;tEnd=Date.now()+tLeft*1000;tRun=setInterval(tstep,250);tdraw()}
function setMin(m){m=Math.min(180,Math.max(1,Math.round(Number(m))||25));
  if((tRun||(tLeft<tTotal&&tLeft>0))&&!confirm("Mudar o tempo reinicia o timer. Continuar?")){tdraw();return}
  tstop();tmin=m;tTotal=m*60;tLeft=tTotal;tDone=false;save("jv.tmin",m);tdraw()}
$("tgo").onclick=function(){if(tRun){tstop();tdraw()}else tstart()};
$("trs").onclick=function(){if((tRun||(tLeft<tTotal&&tLeft>0))&&!confirm("Resetar o timer?"))return;tstop();tLeft=tTotal;tDone=false;tdraw()};
$("tmin").onchange=function(){setMin(this.value)};
document.querySelectorAll(".pre").forEach(function(b){b.onclick=function(){setMin(b.dataset.m)}});

/* painel: gavetas e apps */
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function renderPanel(){
  var g=$("drawers");g.textContent="";
  CFG.drawers.forEach(function(d){
    var c=mk("div","dr");c.setAttribute("role","link");c.tabIndex=0;
    c.appendChild(mk("b","",(d.e?d.e+" ":"")+d.n));c.appendChild(mk("span","",d.d));
    function go(){if(d.u)window.open(d.u,"_blank","noopener");else location.hash="ajustes"}
    c.onclick=go;c.onkeydown=function(e){if(e.key==="Enter")go()};g.appendChild(c)});
  var t=$("apps");t.textContent="";
  CFG.apps.forEach(function(a){var r=mk("tr");r.appendChild(mk("td","",a.f));r.appendChild(mk("td","",a.a));t.appendChild(r)});
  var o=$("out");o.textContent=CFG.out?"❌ Fora: "+CFG.out:"";o.hidden=!CFG.out}
function saveCfg(){save("jade.cfg",CFG)}
function applyBg(){var g="linear-gradient(rgba(6,18,12,.55),rgba(6,18,12,.74))";$("bgimg").style.backgroundImage=BG?g+',url("'+BG+'")':g+',url("fundo.gif")'}

/* ajustes */
function inp(ph,val,cls,fn){var i=mk("input",cls);i.type="text";i.placeholder=ph;i.value=val;i.oninput=function(){fn(i.value)};return i}
function btn(t,fn){var b=mk("button","pill",t);b.type="button";b.onclick=fn;return b}
function rw(kids){var r=mk("div","rw");kids.forEach(function(k){r.appendChild(k)});return r}
function sec(t){var d=mk("div","sec");d.appendChild(mk("h2","",t));return d}
function buildSettings(){
  var S=$("set");S.textContent="";
  var a=sec("Você");
  a.appendChild(rw([inp("Seu nome",CFG.name,"",function(v){CFG.name=v;saveCfg();tick()})]));S.appendChild(a);

  var b=sec("Fundo (tema Jade)");
  var f=mk("input");f.type="file";f.accept="image/*";f.hidden=true;
  f.onchange=function(){var x=f.files[0];if(!x)return;
    if(!/^image\//.test(x.type)){alert("Escolha uma imagem");return}
    if(x.size>3*1024*1024){alert("Imagem grande demais (máximo 3 MB)");return}
    var r=new FileReader();r.onload=function(){
      try{localStorage.setItem("jade.bg",JSON.stringify(r.result))}catch(e){alert("Não coube no armazenamento do navegador");return}
      BG=r.result;applyBg();setTheme("jade");pv.src=BG;pv.hidden=false;st.textContent="Imagem aplicada ✓ (tema Jade ligado)"};r.onerror=function(){alert("Não consegui ler o arquivo")};r.readAsDataURL(x)};
  var st=mk("p","note",BG?"Imagem personalizada ativa.":"Nenhuma imagem personalizada.");
  var pv=mk("img");pv.alt="Prévia";pv.style.cssText="max-width:180px;border-radius:10px;margin:6px 0";pv.hidden=!BG;if(BG)pv.src=BG;
  b.appendChild(rw([btn("Escolher imagem",function(){f.click()}),btn("Remover imagem",function(){BG="";save("jade.bg","");applyBg();pv.hidden=true;st.textContent="Nenhuma imagem personalizada."}),f]));
  b.appendChild(pv);b.appendChild(st);b.appendChild(mk("p","note","GIF ou imagem de até 3 MB. Fica salva só neste aparelho."));S.appendChild(b);

  var c=sec("Gavetas");
  CFG.drawers.forEach(function(d,k){
    c.appendChild(rw([inp("🙂",d.e,"sm",function(v){d.e=v;saveCfg();renderPanel()}),
      inp("Nome",d.n,"",function(v){d.n=v;saveCfg();renderPanel()}),
      inp("Descrição",d.d,"",function(v){d.d=v;saveCfg();renderPanel()}),
      inp("Link https://…",d.u,"",function(v){d.u=ux(v.trim());saveCfg()}),
      btn("✕",function(){CFG.drawers.splice(k,1);saveCfg();renderPanel();buildSettings()})]))});
  if(CFG.drawers.length<12)c.appendChild(btn("+ Adicionar gaveta",function(){CFG.drawers.push({e:"📁",n:"Nova",d:"",u:""});saveCfg();renderPanel();buildSettings()}));
  S.appendChild(c);

  var d=sec("Qual app para quê");
  CFG.apps.forEach(function(p,k){
    d.appendChild(rw([inp("Função (ex.: 📅 Prazos)",p.f,"",function(v){p.f=v;saveCfg();renderPanel()}),
      inp("App (ex.: 🗓️ Agenda)",p.a,"",function(v){p.a=v;saveCfg();renderPanel()}),
      btn("✕",function(){CFG.apps.splice(k,1);saveCfg();renderPanel();buildSettings()})]))});
  if(CFG.apps.length<20)d.appendChild(btn("+ Adicionar app",function(){CFG.apps.push({f:"",a:""});saveCfg();renderPanel();buildSettings()}));
  d.appendChild(rw([inp("Apps que ficaram de fora (texto livre)",CFG.out,"",function(v){CFG.out=v;saveCfg();renderPanel()})]));
  S.appendChild(d);

  var e=sec("Listas");
  lists.forEach(function(l,k){
    e.appendChild(rw([inp("Nome da lista",l.n,"",function(v){l.n=v;save("jv.lists3",lists);render()}),
      btn("✕",function(){if(l.i.length&&!confirm("Apagar esta lista e os "+l.i.length+" itens dela?"))return;lists.splice(k,1);if(!lists.length)lists.push({n:"📥 Inbox",i:[]});commit();buildSettings()})]))});
  if(lists.length<12)e.appendChild(btn("+ Adicionar lista",function(){lists.push({n:"Nova lista",i:[]});commit();buildSettings()}));
  S.appendChild(e);

  var z=sec("Backup");
  var imp=mk("input");imp.type="file";imp.accept="application/json";imp.hidden=true;
  z.appendChild(rw([btn("⬇️ Exportar tudo",function(){
      var data=JSON.stringify({v:2,cfg:CFG,lists:lists,bg:BG},null,2);
      var a=mk("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="jade-backup.json";
      document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}),
    btn("⬆️ Importar",function(){imp.click()}),imp]));
  imp.onchange=function(){var fl=imp.files[0];if(!fl)return;var r=new FileReader();
    r.onload=function(){try{
      var o=JSON.parse(r.result);if(!o||!Array.isArray(o.lists))throw 0;
      var ok=o.lists.every(function(l){return l&&typeof l.n==="string"&&Array.isArray(l.i)&&l.i.every(function(x){return x&&typeof x.t==="string"})});
      if(!ok)throw 0;
      if(!confirm("Substituir tudo deste aparelho pelo conteúdo do arquivo?"))return;
      lists=o.lists.slice(0,12).map(function(l){return{n:sx(l.n,60),i:l.i.map(function(x){return{t:sx(x.t,300),d:!!x.d}})}});
      CFG=clean(o.cfg||DEF);saveCfg();
      BG=(typeof o.bg==="string"&&o.bg.indexOf("data:image/")===0&&o.bg.length<4500000)?o.bg:"";save("jade.bg",BG);
      applyBg();commit();renderPanel();buildSettings();tick()}catch(err){alert("Arquivo inválido")}imp.value=""};
    r.readAsText(fl)};
  z.appendChild(mk("p","note","Tudo fica salvo só neste aparelho. Exporte para levar para outro ou guardar uma cópia."));
  S.appendChild(z)}
applyBg();renderPanel();buildSettings();tick();tdraw();
render();
})();
</script>
